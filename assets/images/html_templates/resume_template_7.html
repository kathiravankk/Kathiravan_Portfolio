<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume - Timeline Template</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #cbd5e1;
            padding: 40px 20px;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
        }

        /* Left Sidebar */
        .left-sidebar {
            flex: 0 0 35%;
            background: linear-gradient(180deg, #1e293b 0%, #334155 100%);
            color: white;
            padding: 40px 25px;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .profile-role {
            font-size: 15px;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Sidebar Sections */
        .sidebar-label {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Contact Section */
        .contact-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .contact-row svg {
            width: 14px;
            height: 14px;
            fill: white;
            flex-shrink: 0;
        }

        .contact-row a {
            color: #93c5fd;
            text-decoration: none;
        }

        .contact-row a:hover {
            text-decoration: underline;
        }

        /* Sidebar Lists */
        .v6-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .v6-list li {
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        /* Education in Sidebar */
        .education-item {
            margin-bottom: 20px;
        }

        .education-item strong {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .education-item div {
            font-size: 13px;
            margin-bottom: 2px;
        }

        .date-text {
            color: #93c5fd;
            font-weight: 600;
            margin-top: 4px;
        }

        .text-muted {
            opacity: 0.7;
            font-size: 12px;
        }

        /* Right Column */
        .right-column {
            flex: 1;
            padding: 40px 30px;
        }

        /* Section Titles in Main Area */
        .main-label {
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #3b82f6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Profile Summary */
        .profile-summary {
            font-size: 13px;
            line-height: 1.7;
            text-align: justify;
            color: #475569;
            margin-bottom: 30px;
        }

        /* Timeline Container */
        .timeline-container {
            position: relative;
            padding-left: 30px;
        }

        .timeline-container::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 8px;
            bottom: 0;
            width: 2px;
            background: #e2e8f0;
        }

        /* Timeline Items */
        .timeline-item_dots {
            position: relative;
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        .timeline-item_dots::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 6px;
            width: 12px;
            height: 12px;
            background: #3b82f6;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 2px #3b82f6;
            z-index: 1;
        }

        .timeline-title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .text-primary {
            color: #3b82f6;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .timeline-desc {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
            margin: 0;
        }

        /* Bullet Lists */
        .summary-bullet-list {
            padding-left: 20px;
            margin: 0;
        }

        .summary-bullet-list li {
            font-size: 13px;
            color: #475569;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        /* Section Spacing */
        section {
            margin-bottom: 35px;
        }

        section:last-child {
            margin-bottom: 0;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        .mb-4 {
            margin-bottom: 30px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding: 20px 0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-dark {
            background-color: #333;
            color: white;
        }

        .btn-dark:hover {
            background-color: #555;
        }

        .btn-outline {
            background-color: transparent;
            color: #333;
            border: 1px solid #333;
        }

        .btn-outline:hover {
            background-color: #333;
            color: white;
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
            }

            .action-buttons,
            .no-print {
                display: none !important;
            }

            .timeline-item_dots {
                page-break-inside: avoid;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .left-sidebar {
                flex: 1;
                padding: 30px 20px;
            }

            .right-column {
                padding: 30px 20px;
            }

            .profile-name {
                font-size: 24px;
            }

            .timeline-container {
                padding-left: 25px;
            }

            .timeline-item_dots::before {
                left: -21px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Left Sidebar -->
    <div class="left-sidebar">
        <!-- Profile Section -->
        <div class="profile-section">
            <h1 class="profile-name" id="name"></h1>
            <div class="profile-role" id="role"></div>
        </div>

        <!-- Contact Section -->
        <section class="mb-4" id="contactSection">
            <h3 class="sidebar-label">Contact</h3>

            <div class="contact-row" id="phoneRow">
                <span id="phone"></span>
            </div>

            <div class="contact-row" id="emailRow">
                <span id="email"></span>
            </div>

            <div class="contact-row" id="locationRow">
                <span id="location"></span>
            </div>

            <div class="contact-row" id="linkedinRow">
                <a id="linkedin" target="_blank">LinkedIn</a>
            </div>

            <div class="contact-row" id="githubRow">
                <a id="github" target="_blank">GitHub</a>
            </div>
        </section>


        <!-- Education Section -->
        <section class="mb-4" id="educationSection">
            <h3 class="sidebar-label">Education</h3>
            <div id="educationList"></div>
        </section>


        <!-- Skills Section -->
        <section class="mb-4" id="skillsSection">
            <h3 class="sidebar-label">Skills</h3>
            <ul class="v6-list" id="skillsList"></ul>
        </section>

        <!-- Languages Section -->
        <section class="mb-4" id="languagesSection">
            <h3 class="sidebar-label">Languages</h3>
            <ul class="v6-list" id="languagesList"></ul>
        </section>

        <!-- Areas of Interest Section -->
        <section class="mb-4" id="interestsSection">
            <h3 class="sidebar-label">Areas of Interest</h3>
            <ul class="v6-list" id="interestsList"></ul>
        </section>
    </div>

    <!-- Right Column -->
    <div class="right-column">
        <!-- Profile Summary -->
        <section id="summarySection">
            <h3 class="main-label">Profile Summary</h3>
            <p class="profile-summary" id="profileSummary"></p>
        </section>


        <!-- Experience Section -->
        <section id="experienceSection">
            <h3 class="main-label">Experience</h3>
            <div class="timeline-container" id="experienceList"></div>
        </section>

        <!-- Projects Section -->

        <section id="projectsSection">
            <h3 class="main-label">Projects</h3>
            <div class="timeline-container" id="projectsList"></div>
        </section>

        <!-- Paper Presentations Section -->

        <section id="speakingSection">
            <h3 class="main-label">Speaking Engagements</h3>
            <div class="timeline-container" id="speakingList"></div>
        </section>

        <!-- Certifications Section -->
        <section id="certificationsSection">
            <h3 class="main-label">Certifications</h3>
            <ul class="summary-bullet-list" id="certificationsList"></ul>
        </section>

        <!-- Achievements Section -->
        <section id="achievementsSection">
            <h3 class="main-label">Achievements</h3>
            <ul class="summary-bullet-list" id="achievementsList"></ul>
        </section>
    </div>
</div>

    <script>
        function hideIfEmpty(sectionId, condition) {
          if (!condition) {
            const el = document.getElementById(sectionId);
            if (el) el.style.display = "none";
          }
        }
    </script>


<script>
    function renderResume(data) {

      // ===== BASIC INFO =====
      document.getElementById("name").innerText =
        data.personal_info?.name || "";

      document.getElementById("role").innerText =
        data.personal_info?.designation || "";

      // ===== CONTACT =====
      setText("phone", data.personal_info?.phone);
      setText("email", data.personal_info?.email);
      setText("location", data.personal_info?.location);

      setLink("linkedin", data.personal_info?.linkedin);
      setLink("github", data.personal_info?.github);

      hideIfEmpty("contactSection",
        data.personal_info?.phone ||
        data.personal_info?.email ||
        data.personal_info?.location ||
        data.personal_info?.linkedin ||
        data.personal_info?.github
      );

      // ===== SUMMARY =====
      setText("profileSummary", data.profile_summary);
      hideIfEmpty("summarySection", data.profile_summary);

      // ===== EDUCATION =====
      renderEducation(data.education);
      hideIfEmpty("educationSection", data.education?.length);

      // ===== LIST SECTIONS =====
      renderList("skillsList", data.skills);
      hideIfEmpty("skillsSection", data.skills?.length);

      renderList("languagesList", data.languages);
      hideIfEmpty("languagesSection", data.languages?.length);

      renderList("interestsList", data.interests);
      hideIfEmpty("interestsSection", data.interests?.length);

      // ===== TIMELINE SECTIONS =====
      renderTimeline("experienceList", data.experience);
      hideIfEmpty("experienceSection", data.experience?.length);

      renderTimeline("projectsList", data.projects);
      hideIfEmpty("projectsSection", data.projects?.length);

      renderTimeline("speakingList", data.speaking);
      hideIfEmpty("speakingSection", data.speaking?.length);

      // ===== BULLET SECTIONS =====
      renderList("certificationsList", data.certifications);
      hideIfEmpty("certificationsSection", data.certifications?.length);

      renderList("achievementsList", data.achievements);
      hideIfEmpty("achievementsSection", data.achievements?.length);
    }

    // ===== HELPERS =====
    function setText(id, value) {
      if (!value) return;
      document.getElementById(id).innerText = value;
    }

    function setLink(id, value) {
      if (!value) return;
      const el = document.getElementById(id);
      el.href = value;
      el.innerText = value;
    }

    function renderList(id, items) {
      const el = document.getElementById(id);
      if (!el || !items) return;
      el.innerHTML = items.map(i => `<li>• ${i}</li>`).join("");
    }

    function renderEducation(items) {
      const el = document.getElementById("educationList");
      if (!el || !items) return;

      el.innerHTML = items.map(e => `
        <div class="education-item">
          <strong>${e.institution}</strong>
          <div>${e.degree}</div>
          <div class="date-text">${e.duration}</div>
          ${e.score ? `<div class="text-muted">${e.score}</div>` : ""}
        </div>
      `).join("");
    }

    function renderTimeline(id, items) {
      const el = document.getElementById(id);
      if (!el || !items) return;

      el.innerHTML = items.map(i => `
        <div class="timeline-item_dots">
          <div class="timeline-title">${i.title}</div>
          ${i.subtitle ? `<div class="text-primary">${i.subtitle}</div>` : ""}
          <p class="timeline-desc">${i.description || ""}</p>
        </div>
      `).join("");
    }
</script>

</body>

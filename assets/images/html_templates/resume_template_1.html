<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">

    <style>
        .resume-container {
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        .section-header {
            font-family: 'Roboto Condensed', sans-serif;
            letter-spacing: 1.2px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .page-break {
            page-break-after: always;
            break-after: page;
        }

        .avoid-break {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* ── Right sidebar border (desktop only) ── */
        .sidebar-col {
            border-left: 1px solid #f0f0f0;
            padding-left: 20px;
        }

        /* ════════════════════════════════════════
           MOBILE RESPONSIVE (≤ 768px)
        ════════════════════════════════════════ */
        @media (max-width: 768px) {
            .resume-v10-page-bg {
                padding: 0 !important;
                background-color: #fff !important;
            }

            .resume-container {
                width: 100% !important;
                min-height: unset !important;
                padding: 20px !important;
                box-shadow: none !important;
                margin: 0 !important;
            }

            #fullName {
                font-size: 26px !important;
            }

            #jobTitle {
                font-size: 15px !important;
            }

            #contactInfo {
                flex-direction: column !important;
                gap: 8px !important;
            }

            .main-col,
            .sidebar-col {
                width: 100% !important;
                max-width: 100% !important;
                flex: 0 0 100% !important;
                padding-right: 0 !important;
                padding-left: 0 !important;
            }

            .sidebar-col {
                border-left: none !important;
                border-top: 1px solid #eee;
                padding-top: 16px;
                margin-top: 8px;
            }
        }

        /* ── Extra-small phones (≤ 480px) ── */
        @media (max-width: 480px) {
            .resume-container {
                padding: 16px !important;
            }

            #fullName {
                font-size: 22px !important;
            }

            #jobTitle {
                font-size: 13px !important;
            }

            .section-header {
                font-size: 12px;
            }
        }

        /* ════════════════════════════════════════
           PRINT STYLES
        ════════════════════════════════════════ */
        @media print {
            body, html {
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
            }

            .resume-v10-page-bg {
                padding: 0 !important;
                background: white !important;
            }

            .resume-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 45px !important;
                width: 210mm !important;
                min-height: auto !important;
                position: relative !important;
            }

            .no-print, .refresh-container {
                display: none !important;
            }

            .sidebar-col {
                border-left: 1px solid #f0f0f0 !important;
            }

            @page {
                margin-top: 2mm !important;
                margin-bottom: 2mm !important;
            }

            @page :first {
                margin-top: 0 !important;
                margin-bottom: 2mm !important;
            }

            @page :last {
                margin-top: 2mm !important;
                margin-bottom: 0 !important;
            }
        }
    </style>
</head>
<body>

<div class="resume-v10-page-bg py-5" style="background-color: #f8f9fa;">
    <div class="resume-container shadow-lg avoid-break"
         style="background: #fff; width: 210mm; min-height: 297mm; margin: auto; color: #333; padding: 45px; position: relative;">

        <!-- Header -->
        <div class="avoid-break">
            <header class="mb-4">
                <h1 id="fullName" style="font-family: 'Roboto Condensed', sans-serif; font-weight: 700; font-size: 40px; margin: 0;"></h1>
                <h4 id="jobTitle" style="color: #3897f0; font-weight: 400; font-size: 18px; margin-top: 4px; display: none;"></h4>

                <div id="contactInfo" class="d-flex flex-wrap gap-3 mt-3" style="font-size: 12px; color: #666;">
                    <a id="emailContainer" href="#" style="color: inherit; text-decoration: none; display: none;">
                        <i class="fas fa-envelope" style="color: #3897f0;"></i>
                        <span id="email"></span>
                    </a>
                    <span id="phoneContainer" style="display: none;">
                        <i class="fas fa-phone-alt" style="color: #3897f0;"></i>
                        <span id="phone"></span>
                    </span>
                    <span id="locationContainer" style="display: none;">
                        <i class="fas fa-map-marker-alt" style="color: #3897f0;"></i>
                        <span id="location"></span>
                    </span>
                    <a id="linkedinLink" href="#" target="_blank" rel="noreferrer" style="color: inherit; text-decoration: none; display: none;">
                        <i class="fab fa-linkedin" style="color: #3897f0;"></i> LinkedIn
                    </a>
                    <a id="githubLink" href="#" target="_blank" rel="noreferrer" style="color: inherit; text-decoration: none; display: none;">
                        <i class="fab fa-github" style="color: #3897f0;"></i> GitHub
                    </a>
                </div>
            </header>
        </div>

        <div class="row g-0">
            <!-- Main column (left) -->
            <div class="main-col col-8 pe-4">

                <!-- SUMMARY -->
                <section id="summarySection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">SUMMARY</h6>
                    <p id="profileSummary" style="font-size: 13px; line-height: 1.6; margin-bottom: 0;"></p>
                </section>

                <!-- PROJECTS -->
                <section id="projectsSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">PROJECTS</h6>
                    <div id="projectsList"></div>
                </section>

                <!-- INTERNSHIPS -->
                <section id="internshipsSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">INTERNSHIPS</h6>
                    <div id="internshipsList"></div>
                </section>

                <!-- TRAININGS -->
                <section id="trainingsSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">TRAINING</h6>
                    <div id="trainingsList"></div>
                </section>

                <!-- EDUCATION -->
                <section id="educationSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">EDUCATION</h6>
                    <div id="educationList"></div>
                </section>

                <!-- ACHIEVEMENTS -->
                <section id="achievementsSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">ACHIEVEMENTS</h6>
                    <ul id="achievementsList" style="font-size: 12px; padding-left: 15px; margin-bottom: 0;"></ul>
                </section>
            </div>

            <!-- Sidebar column (right) -->
            <div class="sidebar-col col-4">

                <!-- SKILLS -->
                <section id="skillsSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">SKILLS</h6>
                    <p id="skillsList" style="font-size: 12px; line-height: 1.8; margin-bottom: 0;"></p>
                </section>

                <!-- CERTIFICATIONS -->
                <section id="certificationsSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">CERTIFICATIONS</h6>
                    <div id="certificationsList"></div>
                </section>

                <!-- LANGUAGES -->
                <section id="languagesSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">LANGUAGES</h6>
                    <p id="languagesList" style="font-size: 12px; margin-bottom: 0;"></p>
                </section>

                <!-- AREAS OF INTEREST -->
                <section id="interestsSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">AREAS OF INTEREST</h6>
                    <p id="interestsList" style="font-size: 12px; margin-bottom: 0;"></p>
                </section>

                <!-- HOBBIES -->
                <section id="hobbiesSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">HOBBIES</h6>
                    <p id="hobbiesList" style="font-size: 12px; margin-bottom: 0;"></p>
                </section>

                <!-- LEADERSHIP -->
                <section id="leadershipSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">LEADERSHIP</h6>
                    <ul id="leadershipList" style="font-size: 12px; padding-left: 15px; margin-bottom: 0;"></ul>
                </section>

                <!-- VOLUNTEER EXPERIENCE -->
                <section id="volunteerSection" class="avoid-break mb-4" style="display: none;">
                    <h6 class="section-header">VOLUNTEER EXPERIENCE</h6>
                    <ul id="volunteerList" style="font-size: 12px; padding-left: 15px; margin-bottom: 0;"></ul>
                </section>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function renderResume(data) {
        console.log('Received data:', data);
        if (!data) return;

        // Personal Info Header
        if (data.personal_info) {
            const pi = data.personal_info;

            // Name
            const fullNameEl = document.getElementById('fullName');
            fullNameEl.textContent = pi.name || '';

            // Job Title
            const jobTitleEl = document.getElementById('jobTitle');
            if (pi.role && pi.role.trim() !== '') {
                jobTitleEl.textContent = pi.role;
                jobTitleEl.style.display = 'block';
            } else {
                jobTitleEl.textContent = '';
                jobTitleEl.style.display = 'none';
            }

            // Email
            const emailContainer = document.getElementById('emailContainer');
            if (pi.email && pi.email.trim() !== '') {
                document.getElementById('email').textContent = pi.email;
                emailContainer.href = 'mailto:' + pi.email;
                emailContainer.style.display = 'inline-block';
            } else {
                emailContainer.style.display = 'none';
            }

            // Phone
            const phoneContainer = document.getElementById('phoneContainer');
            if (pi.phone && pi.phone.trim() !== '') {
                document.getElementById('phone').textContent = pi.phone;
                phoneContainer.style.display = 'inline-block';
            } else {
                phoneContainer.style.display = 'none';
            }

            // Location / Address
            const locationContainer = document.getElementById('locationContainer');
            if (pi.address && pi.address.trim() !== '') {
                document.getElementById('location').textContent = pi.address;
                locationContainer.style.display = 'inline-block';
            } else {
                locationContainer.style.display = 'none';
            }

            // LinkedIn
            const linkedinLink = document.getElementById('linkedinLink');
            if (pi.linkedIn && pi.linkedIn.trim() !== '') {
                linkedinLink.href = pi.linkedIn;
                linkedinLink.style.display = 'inline-block';
            } else {
                linkedinLink.style.display = 'none';
            }

            // GitHub
            const githubLink = document.getElementById('githubLink');
            if (pi.github && pi.github.trim() !== '') {
                githubLink.href = pi.github;
                githubLink.style.display = 'inline-block';
            } else {
                githubLink.style.display = 'none';
            }
        } else {
            document.getElementById('fullName').textContent = '';
            document.getElementById('jobTitle').style.display = 'none';
            document.getElementById('emailContainer').style.display = 'none';
            document.getElementById('phoneContainer').style.display = 'none';
            document.getElementById('locationContainer').style.display = 'none';
            document.getElementById('linkedinLink').style.display = 'none';
            document.getElementById('githubLink').style.display = 'none';
        }

        // Profile Summary
        const summarySection = document.getElementById('summarySection');
        const summaryText = data.profile_summary || (data.updatedProfileSummary && data.updatedProfileSummary.length > 0 ? data.updatedProfileSummary.join(' ') : '');
        if (summaryText && summaryText.trim() !== '') {
            document.getElementById('profileSummary').textContent = summaryText;
            summarySection.style.display = 'block';
        } else {
            document.getElementById('profileSummary').textContent = '';
            summarySection.style.display = 'none';
        }

        // Skills
        const skillsSection = document.getElementById('skillsSection');
        if (data.skills && Array.isArray(data.skills) && data.skills.length > 0) {
            document.getElementById('skillsList').textContent = data.skills.join(', ');
            skillsSection.style.display = 'block';
        } else {
            document.getElementById('skillsList').textContent = '';
            skillsSection.style.display = 'none';
        }

        // Projects
        const projectsSection = document.getElementById('projectsSection');
        const projList = document.getElementById('projectsList');
        projList.innerHTML = '';
        if (data.projects && Array.isArray(data.projects) && data.projects.length > 0) {
            projectsSection.style.display = 'block';
            data.projects.forEach(proj => {
                const projDiv = document.createElement('div');
                projDiv.className = 'mb-3 avoid-break';
                projDiv.innerHTML = `
                    <strong style="font-size: 15px;">${proj.title || proj.project_name || 'Project'}</strong>
                    ${proj.technologies ? `<div style="font-size: 11px; color: #666; margin-top: 2px;">Technologies: ${Array.isArray(proj.technologies) ? proj.technologies.join(', ') : proj.technologies}</div>` : ''}
                    ${proj.description ? `
                        <div style="font-size: 12px; margin-top: 5px;">
                            <ul style="padding-left: 15px; margin-top: 5px; margin-bottom: 0;">
                                ${Array.isArray(proj.description)
                                    ? proj.description.map(d => `<li class="mb-1">${d}</li>`).join('')
                                    : `<li class="mb-1">${proj.description}</li>`}
                            </ul>
                        </div>
                    ` : ''}
                `;
                projList.appendChild(projDiv);
            });
        } else if (data.updatedProjects && Array.isArray(data.updatedProjects) && data.updatedProjects.length > 0) {
            projectsSection.style.display = 'block';
            projList.innerHTML = '<p style="font-size: 12px;">' + data.updatedProjects.join('. ') + '</p>';
        } else {
            projectsSection.style.display = 'none';
        }

        // Internships
        const internshipsSection = document.getElementById('internshipsSection');
        const internList = document.getElementById('internshipsList');
        internList.innerHTML = '';
        if (data.internships && Array.isArray(data.internships) && data.internships.length > 0) {
            internshipsSection.style.display = 'block';
            data.internships.forEach(intern => {
                const internDiv = document.createElement('div');
                internDiv.className = 'mb-3 avoid-break';
                internDiv.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <strong style="font-size: 15px; display: block;">${intern.role || intern.position || 'Intern'}</strong>
                            <div style="font-size: 13px; color: #3897f0;">${intern.company || intern.organization || ''}</div>
                        </div>
                        <span style="font-size: 12px; color: #666; white-space: nowrap; margin-left: 8px;">${formatDateRange(intern.start_date, intern.end_date)}</span>
                    </div>
                    ${intern.description ? `
                        <div style="font-size: 12px; margin-top: 5px;">
                            <ul style="padding-left: 15px; margin-bottom: 0;">
                                ${Array.isArray(intern.description)
                                    ? intern.description.map(d => `<li class="mb-1">${d}</li>`).join('')
                                    : `<li class="mb-1">${intern.description}</li>`}
                            </ul>
                        </div>
                    ` : ''}
                `;
                internList.appendChild(internDiv);
            });
        } else {
            internshipsSection.style.display = 'none';
        }

        // Trainings
        const trainingsSection = document.getElementById('trainingsSection');
        const trainList = document.getElementById('trainingsList');
        trainList.innerHTML = '';
        if (data.trainings && Array.isArray(data.trainings) && data.trainings.length > 0) {
            trainingsSection.style.display = 'block';
            data.trainings.forEach(train => {
                const trainDiv = document.createElement('div');
                trainDiv.className = 'mb-3 avoid-break';
                trainDiv.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <strong style="font-size: 15px; display: block;">${train.title || train.course_name || 'Training'}</strong>
                            <div style="font-size: 13px; color: #3897f0;">${train.organization || train.provider || ''}</div>
                        </div>
                        <span style="font-size: 12px; color: #666; white-space: nowrap; margin-left: 8px;">${train.year || formatDateRange(train.start_date, train.end_date)}</span>
                    </div>
                    ${train.description ? `<div style="font-size: 12px; margin-top: 5px;">${train.description}</div>` : ''}
                `;
                trainList.appendChild(trainDiv);
            });
        } else {
            trainingsSection.style.display = 'none';
        }

        // Education
        const eduSection = document.getElementById('educationSection');
        const eduList = document.getElementById('educationList');
        eduList.innerHTML = '';

        const hasContent = (obj) => {
            return obj && typeof obj === 'object' && Object.values(obj).some(val => val && val.toString().trim() !== '');
        };

        const colleges = Array.isArray(data.colleges)
            ? data.colleges.filter(c => hasContent(c))
            : (hasContent(data.colleges) ? [data.colleges] : []);

        const hasColleges = colleges.length > 0;
        const hasHS = hasContent(data.higher_secondary);
        const hasSec = hasContent(data.secondary);

        if (hasColleges || hasHS || hasSec) {
            eduSection.style.display = 'block';

            if (hasColleges) {
                colleges.forEach(college => {
                    const eduDiv = document.createElement('div');
                    eduDiv.className = 'mb-3 avoid-break';
                    eduDiv.innerHTML = `
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div style="font-size: 15px; font-weight: 600;">${college.degree || college.course || ''}</div>
                                <div style="font-size: 13px; color: #3897f0;">${college.institution || college.college_name || ''}</div>
                            </div>
                            <span style="font-size: 12px; color: #666; white-space: nowrap; margin-left: 8px;">${formatDateRange(college.start_date, college.end_date) || college.year || ''}</span>
                        </div>
                        ${college.percentage || college.cgpa || college.gpa ? `
                            <div style="font-size: 12px; color: #666; margin-top: 2px;">
                                ${college.percentage ? `Percentage: ${college.percentage}` : ''}
                                ${college.cgpa ? `CGPA: ${college.cgpa}` : ''}
                                ${college.gpa ? `GPA: ${college.gpa}` : ''}
                            </div>
                        ` : ''}
                    `;
                    eduList.appendChild(eduDiv);
                });
            }

            if (hasHS) {
                const hs = data.higher_secondary;
                const hsDiv = document.createElement('div');
                hsDiv.className = 'mb-2 avoid-break';
                hsDiv.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div style="font-size: 14px; font-weight: 600;">${hs.institution || 'Higher Secondary'} ${hs.board ? `(${hs.board})` : ''}</div>
                        </div>
                        <span style="font-size: 12px; color: #666; white-space: nowrap; margin-left: 8px;">${hs.year || ''}</span>
                    </div>
                    ${hs.percentage ? `<div style="font-size: 12px; color: #666; margin-top: 2px;">Percentage: ${hs.percentage}</div>` : ''}
                `;
                eduList.appendChild(hsDiv);
            }

            if (hasSec) {
                const sec = data.secondary;
                const secDiv = document.createElement('div');
                secDiv.className = 'mb-2 avoid-break';
                secDiv.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div style="font-size: 14px; font-weight: 600;">${sec.institution || 'Secondary'} ${sec.board ? `(${sec.board})` : ''}</div>
                        </div>
                        <span style="font-size: 12px; color: #666; white-space: nowrap; margin-left: 8px;">${sec.year || ''}</span>
                    </div>
                    ${sec.percentage ? `<div style="font-size: 12px; color: #666; margin-top: 2px;">Percentage: ${sec.percentage}</div>` : ''}
                `;
                eduList.appendChild(secDiv);
            }
        } else {
            eduSection.style.display = 'none';
        }

        // Certifications
        const certificationsSection = document.getElementById('certificationsSection');
        const certList = document.getElementById('certificationsList');
        certList.innerHTML = '';
        if (data.certifications && Array.isArray(data.certifications) && data.certifications.length > 0) {
            certificationsSection.style.display = 'block';
            data.certifications.forEach(cert => {
                const certDiv = document.createElement('div');
                certDiv.className = 'mb-2 avoid-break';
                certDiv.style.fontSize = '12px';
                certDiv.innerHTML = `
                    <div style="font-weight: 600; color: #3897f0;">${cert.name || cert.title || ''}</div>
                    <div class="d-flex justify-content-between">
                        <span style="font-size: 11px; color: #777;">${cert.issuing_organization || cert.provider || ''}</span>
                        <span style="font-size: 11px; color: #777;">${cert.year || cert.date || ''}</span>
                    </div>
                `;
                certList.appendChild(certDiv);
            });
        } else {
            certificationsSection.style.display = 'none';
        }

        // Achievements
        const achievementsSection = document.getElementById('achievementsSection');
        const achList = document.getElementById('achievementsList');
        achList.innerHTML = '';
        if (data.achievements && Array.isArray(data.achievements) && data.achievements.length > 0) {
            achievementsSection.style.display = 'block';
            data.achievements.forEach(ach => {
                const li = document.createElement('li');
                li.className = 'mb-1 avoid-break';
                li.textContent = typeof ach === 'string' ? ach : (ach.description || ach.title || '');
                achList.appendChild(li);
            });
        } else {
            achievementsSection.style.display = 'none';
        }

        // Leadership
        const leadershipSection = document.getElementById('leadershipSection');
        const leadList = document.getElementById('leadershipList');
        leadList.innerHTML = '';
        if (data.leadership && Array.isArray(data.leadership) && data.leadership.length > 0) {
            leadershipSection.style.display = 'block';
            data.leadership.forEach(lead => {
                const li = document.createElement('li');
                li.className = 'mb-1 avoid-break';
                li.textContent = typeof lead === 'string' ? lead : (lead.description || lead.title || lead.position || '');
                leadList.appendChild(li);
            });
        } else {
            leadershipSection.style.display = 'none';
        }

        // Volunteer Experience
        const volunteerSection = document.getElementById('volunteerSection');
        const volList = document.getElementById('volunteerList');
        volList.innerHTML = '';
        if (data.volunteer_experience && Array.isArray(data.volunteer_experience) && data.volunteer_experience.length > 0) {
            volunteerSection.style.display = 'block';
            data.volunteer_experience.forEach(vol => {
                const li = document.createElement('li');
                li.className = 'mb-1 avoid-break';
                li.textContent = typeof vol === 'string' ? vol : (vol.description || vol.role || '');
                volList.appendChild(li);
            });
        } else {
            volunteerSection.style.display = 'none';
        }

        // Languages
        const languagesSection = document.getElementById('languagesSection');
        if (data.languages && Array.isArray(data.languages) && data.languages.length > 0) {
            const langText = data.languages.map(lang => {
                if (typeof lang === 'string') return lang;
                return lang.name ? `${lang.name}${lang.proficiency ? ` (${lang.proficiency})` : ''}` : '';
            }).filter(Boolean).join(', ');

            if (langText.trim() !== '') {
                document.getElementById('languagesList').textContent = langText;
                languagesSection.style.display = 'block';
            } else {
                languagesSection.style.display = 'none';
            }
        } else {
            languagesSection.style.display = 'none';
        }

        // Areas of Interest
        const interestsSection = document.getElementById('interestsSection');
        if (data.areas_of_interest && Array.isArray(data.areas_of_interest) && data.areas_of_interest.length > 0) {
            const interests = data.areas_of_interest.map(i => typeof i === 'string' ? i : i.name || i.title).filter(Boolean);
            if (interests.length > 0) {
                document.getElementById('interestsList').textContent = interests.join(', ');
                interestsSection.style.display = 'block';
            } else {
                interestsSection.style.display = 'none';
            }
        } else {
            interestsSection.style.display = 'none';
        }

        // Hobbies
        const hobbiesSection = document.getElementById('hobbiesSection');
        if (data.hobbies && Array.isArray(data.hobbies) && data.hobbies.length > 0) {
            const hobbies = data.hobbies.map(h => typeof h === 'string' ? h : h.name || h.title).filter(Boolean);
            if (hobbies.length > 0) {
                document.getElementById('hobbiesList').textContent = hobbies.join(', ');
                hobbiesSection.style.display = 'block';
            } else {
                hobbiesSection.style.display = 'none';
            }
        } else {
            hobbiesSection.style.display = 'none';
        }
    }

    function formatDateRange(startDate, endDate) {
        if (!startDate && !endDate) return '';
        const formatDate = (date) => {
            if (!date) return '';
            if (date.toLowerCase() === 'present' || date.toLowerCase() === 'current') return 'Present';
            return date;
        };
        const start = formatDate(startDate);
        const end = formatDate(endDate) || 'Present';
        if (!start && !end) return '';
        if (!start) return end;
        if (!end || end === 'Present') return `${start} - Present`;
        return `${start} - ${end}`;
    }
</script>

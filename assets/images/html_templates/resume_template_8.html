<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume - Elegant Template</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #f8f9fa;
            padding: 40px 20px;
            line-height: 1.6;
            color: #2c3e50;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        /* Header Section */
        .avery-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 50px 40px;
            text-align: center;
        }

        .avery-name {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .avery-role {
            font-size: 20px;
            font-weight: 300;
            opacity: 0.95;
            margin-bottom: 25px;
        }

        /* Contact Info */
        .avery-contact {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            font-size: 14px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-item svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        .contact-item a {
            color: #3498db;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        /* hide contact items that have no data */
        .contact-item.hidden {
            display: none;
        }

        /* Content Area */
        .avery-content {
            padding: 40px;
        }

        /* Profile Summary */
        .profile-summary {
            background: #ecf0f1;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            margin-bottom: 30px;
        }

        .profile-summary p {
            font-size: 14px;
            line-height: 1.8;
            color: #34495e;
            text-align: justify;
            margin: 0;
        }

        /* Section Titles */
        .avery-section-title {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #3498db;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Timeline Container */
        .avery-timeline {
            position: relative;
            padding-left: 35px;
            margin-bottom: 35px;
        }

        .avery-timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 10px;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, #3498db, #2ecc71);
        }

        /* Timeline Items */
        .timeline-item {
            position: relative;
            margin-bottom: 30px;
            padding-bottom: 15px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -29px;
            top: 8px;
            width: 14px;
            height: 14px;
            background: #3498db;
            border: 4px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 3px #3498db;
            z-index: 1;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 15px;
        }

        .item-main-title {
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
            flex: 1;
        }

        .item-date {
            font-size: 13px;
            color: #7f8c8d;
            font-weight: 600;
            white-space: nowrap;
        }

        .item-sub {
            font-size: 14px;
            color: #3498db;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .item-desc-text {
            font-size: 13px;
            color: #555;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .item-list {
            padding-left: 20px;
            margin: 10px 0 0 0;
        }

        .item-list li {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            line-height: 1.6;
        }

        /* Skills */
        .skills-grid-simple {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 25px;
        }

        .skill-pill {
            font-size: 13px;
            color: #2c3e50;
            padding: 8px 0;
            line-height: 1.5;
        }

        /* Hidden sections */
        .section-wrapper.hidden {
            display: none;
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
            }
            .action-buttons, .no-print {
                display: none !important;
            }
            .timeline-item {
                page-break-inside: avoid;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .avery-header {
                padding: 35px 25px;
            }
            .avery-name {
                font-size: 32px;
            }
            .avery-role {
                font-size: 18px;
            }
            .avery-content {
                padding: 25px;
            }
            .avery-contact {
                flex-direction: column;
                gap: 12px;
            }
            .item-header {
                flex-direction: column;
                gap: 5px;
            }
            .avery-timeline {
                padding-left: 25px;
            }
            .timeline-item::before {
                left: -20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header Section -->
    <div class="avery-header">
        <h1 class="avery-name" id="name">Your Name</h1>
        <div class="avery-role" id="role">Student</div>

        <div class="avery-contact">

    </div>

    <!-- Content Section -->
    <div class="avery-content">

        <!-- Profile Summary -->
        <div class="profile-summary">
            <p id="profileSummary"></p>
        </div>

        <!-- Experience Section -->
        <div class="section-wrapper hidden" id="experienceSection">
            <h2 class="avery-section-title">Professional Experience</h2>
            <div class="avery-timeline" id="experienceList"></div>
        </div>

        <!-- Internships Section -->
        <div class="section-wrapper hidden" id="internshipsSection">
            <h2 class="avery-section-title">Internships</h2>
            <div class="avery-timeline" id="internshipsList"></div>
        </div>

        <!-- Trainings Section -->
        <div class="section-wrapper hidden" id="trainingsSection">
            <h2 class="avery-section-title">Training</h2>
            <div class="avery-timeline" id="trainingsList"></div>
        </div>

        <!-- Projects Section -->
        <div class="section-wrapper hidden" id="projectsSection">
            <h2 class="avery-section-title">Projects</h2>
            <div class="avery-timeline" id="projectsList"></div>
        </div>

        <!-- Paper Presentations Section -->
        <div class="section-wrapper hidden" id="presentationsSection">
            <h2 class="avery-section-title">Speaking Engagements</h2>
            <div class="avery-timeline" id="presentationsList"></div>
        </div>

        <!-- Education Section -->
        <div class="section-wrapper" id="educationSection">
            <h2 class="avery-section-title">Education</h2>
            <div class="avery-timeline" id="educationList"></div>
        </div>

        <!-- Skills Section -->
        <div class="section-wrapper hidden" id="skillsSection">
            <h2 class="avery-section-title">Skills</h2>
            <div class="skills-grid-simple" id="skillsList"></div>
        </div>

        <!-- Certifications Section -->
        <div class="section-wrapper hidden" id="certificationsSection">
            <h2 class="avery-section-title">Certifications</h2>
            <div class="avery-timeline" id="certificationsList"></div>
        </div>

        <!-- Achievements Section -->
        <div class="section-wrapper hidden" id="achievementsSection">
            <h2 class="avery-section-title">Achievements</h2>
            <ul class="item-list" id="achievementsList"></ul>
        </div>

        <!-- Languages Section -->
        <div class="section-wrapper hidden" id="languagesSection">
            <h2 class="avery-section-title">Languages</h2>
            <p id="languagesText" style="font-size:13px; color:#555;"></p>
        </div>

        <!-- Areas of Interest Section -->
        <div class="section-wrapper hidden" id="interestsSection">
            <h2 class="avery-section-title">Areas of Interest</h2>
            <p id="interestsText" style="font-size:13px; color:#555;"></p>
        </div>

        <!-- Hobbies Section -->
        <div class="section-wrapper hidden" id="hobbiesSection">
            <h2 class="avery-section-title">Hobbies</h2>
            <p id="hobbiesText" style="font-size:13px; color:#555;"></p>
        </div>

        <!-- Leadership Section -->
        <div class="section-wrapper hidden" id="leadershipSection">
            <h2 class="avery-section-title">Leadership</h2>
            <ul class="item-list" id="leadershipList"></ul>
        </div>

        <!-- Volunteer Section -->
        <div class="section-wrapper hidden" id="volunteerSection">
            <h2 class="avery-section-title">Volunteer Experience</h2>
            <ul class="item-list" id="volunteerList"></ul>
        </div>

    </div>
</div>

<script>
    function show(id) {
        const el = document.getElementById(id);
        if (el) el.classList.remove('hidden');
    }

    function formatDateRange(startDate, endDate) {
        if (!startDate && !endDate) return '';
        const fmt = (d) => {
            if (!d) return '';
            if (d.toLowerCase() === 'present' || d.toLowerCase() === 'current') return 'Present';
            return d;
        };
        const start = fmt(startDate);
        const end = fmt(endDate);
        if (!start && !end) return '';
        if (!start) return end;
        if (!end) return `${start} - Present`;
        return `${start} - ${end}`;
    }

    function renderResume(data) {
        console.log('Received data:', data);

        // ── Personal Info ──────────────────────────────────────────────
        if (data.personal_info) {
            const pi = data.personal_info;

            if (pi.name)  document.getElementById('name').textContent  = pi.name;
            if (pi.role)  document.getElementById('role').textContent  = pi.role;
            if (pi.phone) document.getElementById('phone').textContent = pi.phone;
            if (pi.email) document.getElementById('email').textContent = pi.email;

            const addr = pi.address || pi.location || '';
            if (addr) document.getElementById('location').textContent = addr;

            if (pi.linkedIn || pi.linkedin) {
                const url = pi.linkedIn || pi.linkedin;
                document.getElementById('linkedin').href = url;
                document.getElementById('linkedinItem').classList.remove('hidden');
            }

            if (pi.github) {
                document.getElementById('github').href = pi.github;
                document.getElementById('githubItem').classList.remove('hidden');
            }
        }

        // ── Profile Summary ────────────────────────────────────────────
        if (data.profile_summary) {
            document.getElementById('profileSummary').textContent = data.profile_summary;
        } else if (data.updatedProfileSummary && data.updatedProfileSummary.length > 0) {
            document.getElementById('profileSummary').textContent = data.updatedProfileSummary.join(' ');
        }

        // ── Experience ─────────────────────────────────────────────────
        if (data.experience && data.experience.length > 0) {
            show('experienceSection');
            const expList = document.getElementById('experienceList');
            expList.innerHTML = '';
            data.experience.forEach(exp => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                const desc = Array.isArray(exp.description)
                    ? exp.description.map(d => `<li>${d}</li>`).join('')
                    : exp.description ? `<li>${exp.description}</li>` : '';
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-main-title">${exp.job_title || exp.role || exp.position || 'Position'}</span>
                        <span class="item-date">${formatDateRange(exp.start_date, exp.end_date)}</span>
                    </div>
                    <p class="item-sub">${exp.company || exp.organization || ''}</p>
                    ${desc ? `<ul class="item-list">${desc}</ul>` : ''}
                `;
                expList.appendChild(div);
            });
        }

        // ── Internships ────────────────────────────────────────────────
        if (data.internships && data.internships.length > 0) {
            show('internshipsSection');
            const internList = document.getElementById('internshipsList');
            internList.innerHTML = '';
            data.internships.forEach(intern => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                const desc = Array.isArray(intern.description)
                    ? intern.description.map(d => `<li>${d}</li>`).join('')
                    : intern.description ? `<li>${intern.description}</li>` : '';
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-main-title">${intern.role || intern.position || 'Intern'}</span>
                        <span class="item-date">${formatDateRange(intern.start_date, intern.end_date)}</span>
                    </div>
                    <p class="item-sub">${intern.company || intern.organization || ''}</p>
                    ${desc ? `<ul class="item-list">${desc}</ul>` : ''}
                `;
                internList.appendChild(div);
            });
        }

        // ── Trainings ──────────────────────────────────────────────────
        if (data.trainings && data.trainings.length > 0) {
            show('trainingsSection');
            const trainList = document.getElementById('trainingsList');
            trainList.innerHTML = '';
            data.trainings.forEach(train => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-main-title">${train.title || train.course_name || 'Training'}</span>
                        <span class="item-date">${train.year || formatDateRange(train.start_date, train.end_date)}</span>
                    </div>
                    <p class="item-sub">${train.organization || train.provider || ''}</p>
                    ${train.description ? `<p class="item-desc-text">${train.description}</p>` : ''}
                `;
                trainList.appendChild(div);
            });
        }

        // ── Projects ───────────────────────────────────────────────────
        if (data.projects && data.projects.length > 0) {
            show('projectsSection');
            const projList = document.getElementById('projectsList');
            projList.innerHTML = '';
            data.projects.forEach(proj => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                const desc = Array.isArray(proj.description)
                    ? proj.description.map(d => `<li>${d}</li>`).join('')
                    : proj.description ? `<li>${proj.description}</li>` : '';
                const techs = proj.technologies
                    ? (Array.isArray(proj.technologies) ? proj.technologies.join(', ') : proj.technologies)
                    : '';
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-main-title">${proj.title || proj.project_name || 'Project'}</span>
                        <span class="item-date">${proj.year || ''}</span>
                    </div>
                    ${techs ? `<p class="item-sub">${techs}</p>` : ''}
                    ${desc ? `<ul class="item-list">${desc}</ul>` : ''}
                `;
                projList.appendChild(div);
            });
        }

        // ── Paper Presentations ────────────────────────────────────────
        if (data.paper_presentations && data.paper_presentations.length > 0) {
            show('presentationsSection');
            const presList = document.getElementById('presentationsList');
            presList.innerHTML = '';
            data.paper_presentations.forEach(pres => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-main-title">${typeof pres === 'string' ? pres : (pres.title || pres.name || 'Presentation')}</span>
                        <span class="item-date">${pres.year || pres.date || ''}</span>
                    </div>
                    ${pres.venue ? `<p class="item-sub">${pres.venue}</p>` : ''}
                    ${pres.description ? `<p class="item-desc-text">${pres.description}</p>` : ''}
                `;
                presList.appendChild(div);
            });
        }

        // ── Education ──────────────────────────────────────────────────
        const eduList = document.getElementById('educationList');
        eduList.innerHTML = '';

        const colleges = data.colleges || data.college || data.institution || data.degree || [];
        if (colleges.length > 0) {
            colleges.forEach(college => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                const grade = college.percentage
                    ? `Percentage: ${college.percentage}`
                    : college.cgpa ? `CGPA: ${college.cgpa}`
                    : college.gpa ? `GPA: ${college.gpa}` : '';
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-main-title">${college.institution || college.college_name || 'Institution'}</span>
                        <span class="item-date">${formatDateRange(college.start_date, college.end_date) || college.year || ''}</span>
                    </div>
                    <p class="item-sub">${college.degree || college.course || 'Degree'}</p>
                    ${grade ? `<p class="item-desc-text">${grade}</p>` : ''}
                `;
                eduList.appendChild(div);
            });
        }

        if (data.higher_secondary) {
            const hs = data.higher_secondary;
            const div = document.createElement('div');
            div.className = 'timeline-item';
            div.innerHTML = `
                <div class="item-header">
                    <span class="item-main-title">${hs.institution || 'School'}</span>
                    <span class="item-date">${hs.year || ''}</span>
                </div>
                <p class="item-sub">Higher Secondary${hs.board ? ` (${hs.board})` : ''}</p>
                ${hs.percentage ? `<p class="item-desc-text">Percentage: ${hs.percentage}</p>` : ''}
            `;
            eduList.appendChild(div);
        }

        if (data.secondary) {
            const sec = data.secondary;
            const div = document.createElement('div');
            div.className = 'timeline-item';
            div.innerHTML = `
                <div class="item-header">
                    <span class="item-main-title">${sec.institution || 'School'}</span>
                    <span class="item-date">${sec.year || ''}</span>
                </div>
                <p class="item-sub">Secondary${sec.board ? ` (${sec.board})` : ''}</p>
                ${sec.percentage ? `<p class="item-desc-text">Percentage: ${sec.percentage}</p>` : ''}
            `;
            eduList.appendChild(div);
        }

        // ── Skills ─────────────────────────────────────────────────────
        if (data.skills && data.skills.length > 0) {
            show('skillsSection');
            const skillsList = document.getElementById('skillsList');
            skillsList.innerHTML = '';
            data.skills.forEach(skill => {
                const div = document.createElement('div');
                div.className = 'skill-pill';
                div.textContent = `• ${skill}`;
                skillsList.appendChild(div);
            });
        }

        // ── Certifications ─────────────────────────────────────────────
        if (data.certifications && data.certifications.length > 0) {
            show('certificationsSection');
            const certList = document.getElementById('certificationsList');
            certList.innerHTML = '';
            data.certifications.forEach(cert => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-main-title">${cert.name || cert.title || 'Certification'}</span>
                        <span class="item-date">${cert.year || cert.date || ''}</span>
                    </div>
                    <p class="item-sub">${cert.issuing_organization || cert.provider || ''}</p>
                `;
                certList.appendChild(div);
            });
        }

        // ── Achievements ───────────────────────────────────────────────
        if (data.achievements && data.achievements.length > 0) {
            show('achievementsSection');
            const achList = document.getElementById('achievementsList');
            achList.innerHTML = '';
            data.achievements.forEach(ach => {
                const li = document.createElement('li');
                li.textContent = typeof ach === 'string' ? ach : (ach.description || ach.title || '');
                achList.appendChild(li);
            });
        }

        // ── Languages ──────────────────────────────────────────────────
        if (data.languages && data.languages.length > 0) {
            show('languagesSection');
            const langText = data.languages.map(lang =>
                typeof lang === 'string' ? lang
                : lang.name ? `${lang.name}${lang.proficiency ? ` (${lang.proficiency})` : ''}` : ''
            ).filter(Boolean).join(' • ');
            document.getElementById('languagesText').textContent = langText;
        }

        // ── Areas of Interest ──────────────────────────────────────────
        if (data.areas_of_interest && data.areas_of_interest.length > 0) {
            show('interestsSection');
            const interests = data.areas_of_interest.map(i => typeof i === 'string' ? i : i.name || i.title).filter(Boolean);
            document.getElementById('interestsText').textContent = interests.join(', ');
        }

        // ── Hobbies ────────────────────────────────────────────────────
        if (data.hobbies && data.hobbies.length > 0) {
            show('hobbiesSection');
            const hobbies = data.hobbies.map(h => typeof h === 'string' ? h : h.name || h.title).filter(Boolean);
            document.getElementById('hobbiesText').textContent = hobbies.join(', ');
        }

        // ── Leadership ─────────────────────────────────────────────────
        if (data.leadership && data.leadership.length > 0) {
            show('leadershipSection');
            const leadList = document.getElementById('leadershipList');
            leadList.innerHTML = '';
            data.leadership.forEach(lead => {
                const li = document.createElement('li');
                li.textContent = typeof lead === 'string' ? lead : (lead.description || lead.title || lead.position || '');
                leadList.appendChild(li);
            });
        }

        // ── Volunteer Experience ───────────────────────────────────────
        if (data.volunteer_experience && data.volunteer_experience.length > 0) {
            show('volunteerSection');
            const volList = document.getElementById('volunteerList');
            volList.innerHTML = '';
            data.volunteer_experience.forEach(vol => {
                const li = document.createElement('li');
                li.textContent = typeof vol === 'string' ? vol : (vol.description || vol.role || '');
                volList.appendChild(li);
            });
        }
    }
</script>
</body>
</html>

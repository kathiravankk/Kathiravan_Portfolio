<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume - Modern Blue Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #f4f7f6;
            padding: 40px 20px;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        /* Header Section */
        header {
            background-color: #f8f9fa;
            padding: 50px 45px 30px 45px;
            border-bottom: 5px solid #0056b3;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 42px;
            margin: 0;
            color: #2c3e50;
            letter-spacing: -1px;
        }

        .role {
            color: #0056b3;
            font-weight: 400;
            font-size: 20px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contact-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            font-size: 13px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-item svg {
            width: 14px;
            height: 14px;
            fill: #0056b3;
        }

        .contact-item a {
            color: #0056b3;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .contact-item span {
            color: #444;
        }

        /* Content Section */
        .content-wrapper {
            display: flex;
            padding: 40px 45px;
        }

        .left-column {
            flex: 2;
            padding-right: 30px;
        }

        .right-column {
            flex: 1;
            border-left: 1px solid #eee;
            padding-left: 20px;
        }

        /* Section Headers */
        .section-header {
            font-weight: bold;
            font-size: 14px;
            color: #0056b3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #0056b3;
        }

        /* Sections */
        section {
            margin-bottom: 35px;
        }

        /* Experience Items */
        .experience-item {
            margin-bottom: 25px;
        }

        .experience-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .experience-header svg {
            width: 14px;
            height: 14px;
            fill: #0056b3;
            margin-right: 8px;
        }

        .experience-header strong {
            font-size: 16px;
            color: #2c3e50;
        }

        .experience-meta {
            font-size: 13px;
            color: #0056b3;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .experience-description {
            font-size: 13px;
            color: #444;
            line-height: 1.7;
        }

        /* Lists */
        ul {
            font-size: 13px;
            padding-left: 15px;
            color: #444;
        }

        ul li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        /* Tags/Badges */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            font-size: 12px;
            background: #f0f2f5;
            padding: 3px 10px;
            border-radius: 3px;
            color: #2c3e50;
        }

        /* Education Items */
        .education-item {
            margin-bottom: 20px;
        }

        .education-header {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        .education-header svg {
            width: 14px;
            height: 14px;
            fill: #0056b3;
            margin-right: 8px;
        }

        .education-degree {
            font-size: 13px;
            font-weight: 700;
            color: #2c3e50;
        }

        .education-institution {
            font-size: 12px;
            color: #0056b3;
            font-weight: 500;
        }

        .education-date {
            font-size: 11px;
            color: #888;
        }

        .education-percentage {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        /* Certification Items */
        .cert-item {
            margin-bottom: 15px;
            font-size: 12px;
        }

        .cert-header {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        .cert-header svg {
            width: 12px;
            height: 12px;
            fill: #0056b3;
            margin-right: 8px;
        }

        .cert-name {
            font-weight: 600;
            color: #2c3e50;
        }

        .cert-issuer {
            font-size: 11px;
            color: #777;
            margin-left: 24px;
        }

        .cert-date {
            font-size: 10px;
            color: #999;
            margin-left: 24px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding: 20px 0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-dark {
            background-color: #333;
            color: white;
        }

        .btn-dark:hover {
            background-color: #555;
        }

        .btn-outline {
            background-color: transparent;
            color: #333;
            border: 1px solid #333;
        }

        .btn-outline:hover {
            background-color: #333;
            color: white;
        }

        /* Print Styles */
        @media print {
            @page {
                margin: 0;
                size: A4 portrait;
            }

            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .container {
                box-shadow: none;
                width: 210mm;
                min-height: 297mm;
            }

            .action-buttons,
            .no-print {
                display: none !important;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                padding: 35px 25px 25px 25px;
            }

            h1 {
                font-size: 32px;
            }

            .role {
                font-size: 18px;
            }

            .contact-info {
                flex-direction: column;
                gap: 10px;
            }

            .content-wrapper {
                flex-direction: column;
                padding: 25px;
            }

            .left-column {
                padding-right: 0;
                margin-bottom: 25px;
            }

            .right-column {
                border-left: none;
                border-top: 1px solid #eee;
                padding-left: 0;
                padding-top: 25px;
            }
        }
    </style>
</head>
<body>
<script>
    const RESUME_DATA = {{RESUME_DATA}};
</script>

<div class="container">
    <header>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>

        <div class="contact-info">
            <span id="email"></span>
            <span id="phone"></span>
            <span id="location"></span>
            <a id="linkedin" target="_blank">LinkedIn</a>
            <a id="github" target="_blank">GitHub</a>
        </div>
    </header>

    <div class="content-wrapper">
        <!-- LEFT COLUMN -->
        <div class="left-column">
            <section>
                <div class="section-header">Profile Summary</div>
                <p id="profileSummary"></p>
            </section>

            <section>
                <div class="section-header">Experience</div>
                <div id="experience"></div>
            </section>

            <section>
                <div class="section-header">Projects</div>
                <div id="projects"></div>
            </section>

            <section>
                <div class="section-header">Achievements</div>
                <ul id="achievements"></ul>
            </section>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="right-column">
            <section>
                <div class="section-header">Skills</div>
                <div class="tag-container" id="skills"></div>
            </section>

            <section>
                <div class="section-header">Education</div>
                <div id="education"></div>
            </section>

            <section>
                <div class="section-header">Certifications</div>
                <div id="certifications"></div>
            </section>

            <section>
                <div class="section-header">Languages</div>
                <div class="tag-container" id="languages"></div>
            </section>

            <section>
                <div class="section-header">Areas of Interest</div>
                <div class="tag-container" id="interests"></div>
            </section>

            <section>
                <div class="section-header">Hobbies</div>
                <div class="tag-container" id="hobbies"></div>
            </section>
        </div>
    </div>
</div>

<script>
    function formatDateRange(startDate, endDate) {
        if (!startDate && !endDate) return "";
        return `${startDate || ""} - ${endDate || "Present"}`;
    }

    function createTags(items, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        (items || []).forEach(item => {
            container.innerHTML += `<span class="tag">${item}</span>`;
        });
    }

    function renderResume(apiResponse) {
        const data = apiResponse.extracted_data || apiResponse;
        const personal = data.personal_info || {};

        // ================= PERSONAL =================
        document.getElementById("name").innerText =
            personal.name || personal.full_name || "";

        document.getElementById("role").innerText =
            personal.role || personal.job_title || "Student";

        document.getElementById("email").innerText =
            personal.email || "";

        document.getElementById("phone").innerText =
            personal.phone || personal.phone_number || "";

        document.getElementById("location").innerText =
            personal.address || personal.location || "India";

        document.getElementById("linkedin").href =
            personal.linkedIn || personal.linkedin || "#";

        document.getElementById("github").href =
            personal.github || "#";

        // ================= SUMMARY =================
        document.getElementById("profileSummary").innerText =
            data.profile_summary ||
            (data.updatedProfileSummary || []).join(" ");

        // ================= EXPERIENCE =================
        const expDiv = document.getElementById("experience");
        expDiv.innerHTML = "";

        (data.experience || []).forEach(exp => {
            const descriptions = Array.isArray(exp.description)
                ? exp.description
                : [exp.description || ""];

            expDiv.innerHTML += `
                <div class="experience-item">
                    <div class="experience-header">
                        <strong>${exp.role || exp.position || exp.title || ""}</strong>
                    </div>
                    <div class="experience-meta">
                        ${exp.company || exp.organization || ""}
                        ${formatDateRange(exp.start_date, exp.end_date)}
                    </div>
                    <ul>
                        ${descriptions
                            .filter(Boolean)
                            .map(d => `<li>${d}</li>`)
                            .join("")}
                    </ul>
                </div>
            `;
        });

        // ================= PROJECTS =================
        const projDiv = document.getElementById("projects");
        projDiv.innerHTML = "";

        (data.projects || []).forEach(project => {
            const desc = Array.isArray(project.description)
                ? project.description
                : [project.description || ""];

            projDiv.innerHTML += `
                <div class="experience-item">
                    <div class="experience-header">
                        <strong>${project.title || project.project_name || ""}</strong>
                    </div>
                    ${
                        project.technologies
                            ? `<div class="experience-meta">${Array.isArray(project.technologies)
                                ? project.technologies.join(", ")
                                : project.technologies}</div>`
                            : ""
                    }
                    <ul>
                        ${desc.filter(Boolean).map(d => `<li>${d}</li>`).join("")}
                    </ul>
                </div>
            `;
        });

        // ================= ACHIEVEMENTS =================
        const achievementDiv = document.getElementById("achievements");
        achievementDiv.innerHTML = "";

        (data.achievements || []).forEach(item => {
            achievementDiv.innerHTML += `<li>${item}</li>`;
        });

        // ================= SKILLS =================
        createTags(data.skills, "skills");

        // ================= LANGUAGES =================
        createTags(data.languages, "languages");

        // ================= INTERESTS =================
        createTags(
            data.areas_of_interest ||
            data.interests,
            "interests"
        );

        // ================= HOBBIES =================
        createTags(data.hobbies, "hobbies");

        // ================= EDUCATION =================
        const eduDiv = document.getElementById("education");
        eduDiv.innerHTML = "";

        (data.college || []).forEach(edu => {
            eduDiv.innerHTML += `
                <div class="education-item">
                    <div class="education-degree">
                        ${edu.degree || edu.course || ""}
                    </div>
                    <div class="education-institution">
                        ${edu.institution || edu.college_name || ""}
                    </div>
                    <div class="education-date">
                        ${formatDateRange(edu.start_date, edu.end_date)}
                    </div>
                    ${
                        edu.cgpa
                            ? `<div class="education-percentage">CGPA: ${edu.cgpa}</div>`
                            : ""
                    }
                    ${
                        edu.percentage
                            ? `<div class="education-percentage">Percentage: ${edu.percentage}</div>`
                            : ""
                    }
                </div>
            `;
        });

        // ================= CERTIFICATIONS =================
        const certDiv = document.getElementById("certifications");
        certDiv.innerHTML = "";

        (data.certifications || []).forEach(cert => {
            certDiv.innerHTML += `
                <div class="cert-item">
                    <div class="cert-name">${cert.name || cert.title || ""}</div>
                    <div class="cert-issuer">${cert.issuing_organization || cert.provider || ""}</div>
                    <div class="cert-date">${cert.year || cert.date || ""}</div>
                </div>
            `;
        });
    }

    renderResume(RESUME_DATA);
</script>
</body>
</html>

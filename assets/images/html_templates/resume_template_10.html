<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume - Modern Blue Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #f4f7f6;
            padding: 40px 20px;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        /* Header Section */
        header {
            background-color: #f8f9fa;
            padding: 50px 45px 30px 45px;
            border-bottom: 5px solid #0056b3;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 42px;
            margin: 0;
            color: #2c3e50;
            letter-spacing: -1px;
        }

        .role {
            color: #0056b3;
            font-weight: 400;
            font-size: 20px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contact-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            font-size: 13px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-item svg {
            width: 14px;
            height: 14px;
            fill: #0056b3;
        }

        .contact-item a {
            color: #0056b3;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .contact-item span {
            color: #444;
        }

        /* Content Section */
        .content-wrapper {
            display: flex;
            padding: 40px 45px;
        }

        .left-column {
            flex: 2;
            padding-right: 30px;
        }

        .right-column {
            flex: 1;
            border-left: 1px solid #eee;
            padding-left: 20px;
        }

        /* Section Headers */
        .section-header {
            font-weight: bold;
            font-size: 14px;
            color: #0056b3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #0056b3;
        }

        /* Sections */
        section {
            margin-bottom: 35px;
        }

        /* Experience Items */
        .experience-item {
            margin-bottom: 25px;
        }

        .experience-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .experience-header svg {
            width: 14px;
            height: 14px;
            fill: #0056b3;
            margin-right: 8px;
        }

        .experience-header strong {
            font-size: 16px;
            color: #2c3e50;
        }

        .experience-meta {
            font-size: 13px;
            color: #0056b3;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .experience-description {
            font-size: 13px;
            color: #444;
            line-height: 1.7;
        }

        /* Lists */
        ul {
            font-size: 13px;
            padding-left: 15px;
            color: #444;
        }

        ul li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        /* Tags/Badges */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            font-size: 12px;
            background: #f0f2f5;
            padding: 3px 10px;
            border-radius: 3px;
            color: #2c3e50;
        }

        /* Education Items */
        .education-item {
            margin-bottom: 20px;
        }

        .education-header {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        .education-header svg {
            width: 14px;
            height: 14px;
            fill: #0056b3;
            margin-right: 8px;
        }

        .education-degree {
            font-size: 13px;
            font-weight: 700;
            color: #2c3e50;
        }

        .education-institution {
            font-size: 12px;
            color: #0056b3;
            font-weight: 500;
        }

        .education-date {
            font-size: 11px;
            color: #888;
        }

        .education-percentage {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        /* Certification Items */
        .cert-item {
            margin-bottom: 15px;
            font-size: 12px;
        }

        .cert-header {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        .cert-header svg {
            width: 12px;
            height: 12px;
            fill: #0056b3;
            margin-right: 8px;
        }

        .cert-name {
            font-weight: 600;
            color: #2c3e50;
        }

        .cert-issuer {
            font-size: 11px;
            color: #777;
            margin-left: 24px;
        }

        .cert-date {
            font-size: 10px;
            color: #999;
            margin-left: 24px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding: 20px 0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-dark {
            background-color: #333;
            color: white;
        }

        .btn-dark:hover {
            background-color: #555;
        }

        .btn-outline {
            background-color: transparent;
            color: #333;
            border: 1px solid #333;
        }

        .btn-outline:hover {
            background-color: #333;
            color: white;
        }

        /* Print Styles */
        @media print {
            @page {
                margin: 0;
                size: A4 portrait;
            }

            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .container {
                box-shadow: none;
                width: 210mm;
                min-height: 297mm;
            }

            .action-buttons,
            .no-print {
                display: none !important;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                padding: 35px 25px 25px 25px;
            }

            h1 {
                font-size: 32px;
            }

            .role {
                font-size: 18px;
            }

            .contact-info {
                flex-direction: column;
                gap: 10px;
            }

            .content-wrapper {
                flex-direction: column;
                padding: 25px;
            }

            .left-column {
                padding-right: 0;
                margin-bottom: 25px;
            }

            .right-column {
                border-left: none;
                border-top: 1px solid #eee;
                padding-left: 0;
                padding-top: 25px;
            }
        }
    </style>
</head>
<body>
<script>
    const RESUME_DATA = {{RESUME_DATA}};
</script>

<div class="container">
    <header>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>

        <div class="contact-info">
            <span id="email"></span>
            <span id="phone"></span>
            <span id="location"></span>
            <a id="linkedin" target="_blank">LinkedIn</a>
            <a id="github" target="_blank">GitHub</a>
        </div>
    </header>

    <div class="content-wrapper">
        <!-- LEFT COLUMN -->
        <div class="left-column">
            <section>
                <div class="section-header">Profile Summary</div>
                <p id="profileSummary"></p>
            </section>

            <section>
                <div class="section-header">Experience</div>
                <div id="experience"></div>
            </section>

            <section>
                <div class="section-header">Projects</div>
                <div id="projects"></div>
            </section>

            <section>
                <div class="section-header">Achievements</div>
                <ul id="achievements"></ul>
            </section>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="right-column">
            <section>
                <div class="section-header">Skills</div>
                <div class="tag-container" id="skills"></div>
            </section>

            <section>
                <div class="section-header">Education</div>
                <div id="education"></div>
            </section>

            <section>
                <div class="section-header">Certifications</div>
                <div id="certifications"></div>
            </section>

            <section>
                <div class="section-header">Languages</div>
                <div class="tag-container" id="languages"></div>
            </section>

            <section>
                <div class="section-header">Areas of Interest</div>
                <div class="tag-container" id="interests"></div>
            </section>

            <section>
                <div class="section-header">Hobbies</div>
                <div class="tag-container" id="hobbies"></div>
            </section>
        </div>
    </div>
</div>

<script>
    function renderResume(data) {
        console.log('Received data:', data);
        if (!data) return;

        // ── Exact field names from NewStudentProfileModel.toJson() ─────────
        const name     = data.studname     || '';
        const email    = data.studemail    || '';
        const phone    = data.studmobileno || '';
        const location = data.location    || '';
        const role     = data.role         || '';
        const linkedin = data.linkedIn     || '';
        const github   = data.github       || '';
        const summary  = data.profile_summary || '';

        // Skills: studprogramminglang (List<String>)
        const rawSkills = data.studprogramminglang || [];
        const skills = flattenSkills(rawSkills);

        // Education: data.college (flat list) OR data.education.college (nested)
        const eduCollege = (data.education && Array.isArray(data.education.college)
                            ? data.education.college : null)
                           || (Array.isArray(data.college) ? data.college : []);
        const schoolObj = (data.education && data.education.school) || null;
        // higher_secondary and secondary are Lists in the model
        const hsRaw  = (schoolObj && schoolObj.higher_secondary) || data.higher_secondary;
        const secRaw = (schoolObj && schoolObj.secondary)        || data.secondary;
        const hsArr  = Array.isArray(hsRaw)  ? hsRaw  : (hsRaw  ? [hsRaw]  : []);
        const secArr = Array.isArray(secRaw) ? secRaw : (secRaw ? [secRaw] : []);

        // Certifications: studentcertificate (List<StudentCertificate>)
        const certs = data.studentcertificate || [];
        // Languages: languages_known (List<String>)
        const langs = data.languages_known || [];
        // Areas of interest: areas_of_interest (List<String>)
        const aoi   = data.areas_of_interest || [];
        // Hobbies: hobbies (List<String>)
        const hobArr = data.hobbies || [];

        // ── Helpers ────────────────────────────────────────────────────────
        function isNonEmpty(obj) {
            if (!obj || typeof obj !== 'object') return false;
            return Object.entries(obj).some(([k,v]) =>
                k !== '_id' && k !== 'id' && v != null && String(v).trim() !== '');
        }
        function flattenSkills(arr) {
            const r = [];
            (arr || []).forEach(s => {
                if (typeof s === 'string') {
                    const t = s.trim();
                    if (t.startsWith('[')) {
                        try { JSON.parse(t).forEach(x => x && r.push(String(x).trim())); return; }
                        catch(e) {}
                    }
                    const c = t.replace(/^\["|"\]$/g,'').replace(/^"|"$/g,'').trim();
                    if (c) r.push(c);
                } else if (s) r.push(String(s));
            });
            return r;
        }
        function isItemVerified(t) {
            if (!t) return false;
            if (data.isVerified) return true;
            const list = (data.verified_items || []).map(v => String(v).toLowerCase().trim());
            const tl = String(t).toLowerCase().trim();
            return list.includes(tl) || list.some(v => v && (tl.includes(v) || v.includes(tl)));
        }
        function badge(t) {
            if (!isItemVerified(t)) return '';
            return `<i class="fas fa-check-circle" style="color:#3897f0;margin-left:4px;font-size:11px;"></i>`;
        }
        function setText(id, val) {
            const el = document.getElementById(id);
            if (el) el.textContent = val || '';
        }
        // Show/hide a section - works for both style.display and class="hidden"
        function showSection(id, show) {
            const el = document.getElementById(id);
            if (!el) return;
            if (show) {
                el.classList.remove('hidden');
                el.style.display = '';
            } else {
                el.style.display = 'none';
            }
        }
        function setLink(id, url, text) {
            const el = document.getElementById(id);
            if (!el) return;
            if (url) {
                el.href = url;
                if (text && el.tagName === 'A') el.textContent = text;
                showSection(id, true);
            } else {
                el.style.display = 'none';
            }
        }
        function formatDateRange(s, e) {
            if (!s && !e) return '';
            return s ? `${s} - ${e || 'Present'}` : (e || '');
        }

        // ── PERSONAL INFO ─────────────────────────────────────────────────
        setText('fullName', name); setText('name', name);
        ['jobTitle','role'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.textContent = role; el.style.display = role ? '' : 'none'; }
        });
        setText('email', email);
        ['emailLink','emailContact'].forEach(id => setLink(id, email ? 'mailto:'+email : null));
        setText('phone', phone);
        const phoneLink = document.getElementById('phoneLink');
        if (phoneLink) phoneLink.href = phone ? 'tel:'+phone : '#';
        ['phoneRow','phoneItem','phoneContainer'].forEach(id => showSection(id, !!phone));
        setText('location', location);
        ['locationRow','locationItem','locationContainer'].forEach(id => showSection(id, !!location));

        // LinkedIn
        ['linkedinLink','linkedinContact','linkedin'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            if (linkedin) { el.href = linkedin; if (el.tagName === 'A') el.textContent = linkedin; }
        });
        setText('linkedIn', linkedin);
        ['linkedinContact','linkedinLink','linkedinRow','linkedinItem'].forEach(id => showSection(id, !!linkedin));

        // GitHub
        ['githubLink','githubContact','github'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            if (github) { el.href = github; if (el.tagName === 'A') el.textContent = github; }
        });
        ['githubContact','githubLink','githubRow','githubItem'].forEach(id => showSection(id, !!github));

        // ── PROFILE SUMMARY ───────────────────────────────────────────────
        ['profileSummary','summaryText','aboutText'].forEach(id => setText(id, summary));
        ['summarySection','aboutSection'].forEach(id => showSection(id, !!summary));

        // ── SKILLS ───────────────────────────────────────────────────────
        const skillsSection = document.getElementById('skillsSection');
        ['skillsList','skillsContainer','skillsGrid','skills'].forEach(cid => {
            const el = document.getElementById(cid);
            if (!el) return;
            el.innerHTML = '';
            skills.forEach(s => {
                if (el.tagName === 'UL' || el.tagName === 'OL') {
                    el.innerHTML += `<li>${s}${badge(s)}</li>`;
                } else {
                    const sp = document.createElement('span');
                    sp.className = 'skill-tag skill-badge tag';
                    sp.innerHTML = s + badge(s);
                    el.appendChild(sp);
                }
            });
        });
        if (skillsSection) showSection('skillsSection', skills.length > 0);

        // ── EDUCATION ─────────────────────────────────────────────────────
        const eduListEl = document.getElementById('educationList') || document.getElementById('education');
        if (eduListEl) {
            eduListEl.innerHTML = '';
            let hasEdu = false;
            eduCollege.forEach(col => {
                if (!isNonEmpty(col)) return;
                hasEdu = true;
                const deg = [col.degree, col.department].filter(Boolean).join(' - ');
                const dur = [col.start_year || col.startYear, col.end_year || col.endYear].filter(Boolean).join(' - ');
                eduListEl.innerHTML += `
                    <div class="education-item mb-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div style="font-size:15px;font-weight:600;">${deg || 'Degree'}</div>
                                <div style="font-size:13px;color:#3897f0;">${col.institution || ''}</div>
                            </div>
                            <span style="font-size:12px;color:#666;white-space:nowrap;margin-left:8px;">${dur}</span>
                        </div>
                        ${col.cgpa ? `<div style="font-size:12px;color:#666;margin-top:2px;">CGPA: ${col.cgpa}</div>` : ''}
                    </div>`;
            });
            hsArr.forEach(hs => {
                if (!isNonEmpty(hs)) return;
                hasEdu = true;
                eduListEl.innerHTML += `
                    <div class="education-item mb-2">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div style="font-size:14px;font-weight:600;">Higher Secondary${hs.board ? ' ('+hs.board+')' : ''}</div>
                                <div style="font-size:13px;color:#666;">${hs.institution || ''}</div>
                            </div>
                            <span style="font-size:12px;color:#666;white-space:nowrap;margin-left:8px;">${hs.year_of_passing || ''}</span>
                        </div>
                        ${hs.percentage ? `<div style="font-size:12px;color:#666;">Percentage: ${hs.percentage}</div>` : ''}
                    </div>`;
            });
            secArr.forEach(sec => {
                if (!isNonEmpty(sec)) return;
                hasEdu = true;
                eduListEl.innerHTML += `
                    <div class="education-item mb-2">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div style="font-size:14px;font-weight:600;">Secondary${sec.board ? ' ('+sec.board+')' : ''}</div>
                                <div style="font-size:13px;color:#666;">${sec.institution || ''}</div>
                            </div>
                            <span style="font-size:12px;color:#666;white-space:nowrap;margin-left:8px;">${sec.year_of_passing || ''}</span>
                        </div>
                        ${sec.percentage ? `<div style="font-size:12px;color:#666;">Percentage: ${sec.percentage}</div>` : ''}
                    </div>`;
            });
            showSection('educationSection', hasEdu);
        }

        // ── INTERNSHIPS ───────────────────────────────────────────────────
        const internships = data.internships || [];
        const internList = document.getElementById('internshipsList');
        if (internList) {
            internList.innerHTML = '';
            internships.forEach(intern => {
                const r = intern.role || 'Intern';
                const desc = intern.description || '';
                internList.innerHTML += `
                    <div class="internship-item mb-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div style="font-size:15px;font-weight:600;">${r}${badge(r)}</div>
                                <div style="font-size:13px;color:#3897f0;">${intern.company || ''}</div>
                            </div>
                            <span style="font-size:12px;color:#666;white-space:nowrap;margin-left:8px;">${intern.duration || ''}</span>
                        </div>
                        ${desc ? `<div style="font-size:12px;margin-top:5px;">${desc}</div>` : ''}
                    </div>`;
            });
            showSection('internshipsSection', internships.length > 0);
        }

        // ── PROJECTS ──────────────────────────────────────────────────────
        const projects = data.projects || [];
        const projList = document.getElementById('projectsList') || document.getElementById('projects');
        if (projList) {
            projList.innerHTML = '';
            projects.forEach(proj => {
                const t = proj.title || 'Project';
                const descArr = Array.isArray(proj.description) ? proj.description : (proj.description ? [proj.description] : []);
                projList.innerHTML += `
                    <div class="project-item mb-3">
                        <div style="font-size:15px;font-weight:600;">${t}${badge(t)}</div>
                        ${descArr.length > 0 ? `<div style="font-size:12px;margin-top:5px;">${descArr.join(' ')}</div>` : ''}
                    </div>`;
            });
            showSection('projectsSection', projects.length > 0);
        }

        // ── TRAININGS ─────────────────────────────────────────────────────
        const trainings = Array.isArray(data.trainings) ? data.trainings : [];
        const trainList = document.getElementById('trainingsList');
        if (trainList) {
            trainList.innerHTML = '';
            trainings.forEach(train => {
                const t = train.title || train.course_name || 'Training';
                trainList.innerHTML += `
                    <div class="training-item mb-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div style="font-size:15px;font-weight:600;">${t}</div>
                                <div style="font-size:13px;color:#3897f0;">${train.organization || train.provider || ''}</div>
                            </div>
                            <span style="font-size:12px;color:#666;white-space:nowrap;margin-left:8px;">${train.year || train.duration || ''}</span>
                        </div>
                        ${train.description ? `<div style="font-size:12px;margin-top:5px;">${train.description}</div>` : ''}
                    </div>`;
            });
            showSection('trainingsSection', trainings.length > 0);
        }

        // ── PAPER PRESENTATIONS ───────────────────────────────────────────
        const presentations = data.paper_presentations || [];
        const presList = document.getElementById('presentationsList') || document.getElementById('speakingList');
        if (presList) {
            presList.innerHTML = '';
            presentations.forEach(pres => {
                const t = pres.title || 'Presentation';
                presList.innerHTML += `
                    <div class="presentation-item mb-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div style="font-size:15px;font-weight:600;">${t}${badge(t)}</div>
                                ${pres.event ? `<div style="font-size:13px;color:#3897f0;">${pres.event}</div>` : ''}
                            </div>
                            <span style="font-size:12px;color:#666;white-space:nowrap;margin-left:8px;">${pres.year || ''}</span>
                        </div>
                        ${pres.description ? `<div style="font-size:12px;margin-top:5px;">${pres.description}</div>` : ''}
                    </div>`;
            });
            const presSection = document.getElementById('presentationsSection') || document.getElementById('speakingSection');
            if (presSection) showSection(presSection.id, presentations.length > 0);
        }

        // ── INDUSTRIAL VISITS ─────────────────────────────────────────────
        const visits = data.industrial_visits || [];
        const visitList = document.getElementById('visitsList');
        if (visitList) {
            visitList.innerHTML = '';
            visits.forEach(visit => {
                visitList.innerHTML += `
                    <div class="visit-item mb-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div style="font-size:15px;font-weight:600;">${visit.company || 'Visit'}</div>
                                ${visit.location ? `<div style="font-size:13px;color:#666;">${visit.location}</div>` : ''}
                            </div>
                            <span style="font-size:12px;color:#666;white-space:nowrap;margin-left:8px;">${visit.date || ''}</span>
                        </div>
                    </div>`;
            });
            showSection('visitsSection', visits.length > 0);
        }

        // ── CERTIFICATIONS ────────────────────────────────────────────────
        const certListEl = document.getElementById('certificationsList') || document.getElementById('certifications');
        if (certListEl) {
            certListEl.innerHTML = '';
            certs.forEach(cert => {
                const n = cert.name || '';
                certListEl.innerHTML += `
                    <div class="cert-item mb-2">
                        <div style="font-weight:600;color:#3897f0;">${n}${badge(n)}</div>
                        <div class="d-flex justify-content-between">
                            <span style="font-size:11px;color:#777;">${cert.issuer || ''}</span>
                            <span style="font-size:11px;color:#777;">${cert.date || ''}</span>
                        </div>
                    </div>`;
            });
            showSection('certificationsSection', certs.length > 0);
        }

        // ── PLAIN LIST SECTIONS ───────────────────────────────────────────
        renderPlainList(data.achievements,        'achievementsSection',  'achievementsList');
        renderPlainList(data.publications,        'publicationsSection',  'publicationsList');
        renderPlainList(data.workshops,           'workshopsSection',     'workshopsList');
        renderPlainList(data.leadership,          'leadershipSection',    'leadershipList');
        renderPlainList(data.volunteer_experience,'volunteerSection',     'volunteerList');

        // ── LANGUAGES ─────────────────────────────────────────────────────
        renderStringList('languagesSection', langs, ['languagesList','languagesText','languages','languagesContainer']);

        // ── AREAS OF INTEREST ─────────────────────────────────────────────
        renderStringList('interestsSection', aoi, ['interestsList','interestsText','interests','interestsContainer']);

        // ── HOBBIES ───────────────────────────────────────────────────────
        renderStringList('hobbiesSection', hobArr, ['hobbiesList','hobbiesText','hobbies','hobbiesContainer']);
    }

    // Renders a list of strings into a section - handles both div (text) and ul (li) containers
    function renderStringList(sectionId, items, containerIds) {
        containerIds.forEach(cid => {
            const el = document.getElementById(cid);
            if (!el) return;
            if (el.tagName === 'UL' || el.tagName === 'OL') {
                el.innerHTML = items.map(v => `<li>${v}</li>`).join('');
            } else if (el.classList.contains('tag-container') || el.classList.contains('tags-container')) {
                el.innerHTML = '';
                items.forEach(v => {
                    const sp = document.createElement('span');
                    sp.className = 'tag skill-badge';
                    sp.textContent = v;
                    el.appendChild(sp);
                });
            } else {
                el.textContent = items.join(', ');
            }
        });
        showSection(sectionId, items.length > 0);
    }

    function renderPlainList(items, sectionId, listId) {
        const section = document.getElementById(sectionId);
        const list = document.getElementById(listId);
        if (!list) return;
        list.innerHTML = '';
        const arr = Array.isArray(items) ? items : [];
        arr.forEach(item => {
            const el = document.createElement(list.tagName === 'UL' || list.tagName === 'OL' ? 'li' : 'div');
            el.className = 'mb-1';
            el.textContent = typeof item === 'string' ? item : (item.description || item.title || item.name || '');
            list.appendChild(el);
        });
        if (section) showSection(sectionId, arr.length > 0);
    }

    function showSection(id, show) {
        const el = typeof id === 'string' ? document.getElementById(id) : id;
        if (!el) return;
        if (show) {
            el.classList.remove('hidden');
            el.style.display = '';
        } else {
            el.style.display = 'none';
        }
    }

    function formatDateRange(s, e) {
        if (!s && !e) return '';
        return s ? `${s} - ${e || 'Present'}` : (e || '');
    }
</script>
